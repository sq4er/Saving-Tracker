name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flet
        run: pip install flet flet-cli

      - name: Build APK
        run: >
          flet build apk
          --project "budget_manager"
          --product "مدير الميزانية الشخصية"
          --org com.example
          --yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
